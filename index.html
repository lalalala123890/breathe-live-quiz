<style>

:root[data-theme="dark"]{--bg:#081922;--panel:#102a36;--ink:#eaf6f4;--mute:#8fb3b8;--line:#1f4453;--o2:#6fe7ff;--co2:#ffb454}

.wrap{display:grid;gap:14px}@media(min-width:860px){.wrap{grid-template-columns:minmax(0,1.1fr) minmax(0,1fr);align-items:start}}

.bar i{transition:width .4s}.ghost:disabled{opacity:.35;cursor:default}
.nav{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--bg);padding:6px 0 10px;display:grid;gap:7px;margin-bottom:8px}
.navrow{display:flex;justify-content:space-between;align-items:center;gap:10px}#secNo{font-size:18px}#secName{color:var(--mute);font-size:17px}

.fade{animation:fi .45s ease}@keyframes fi{from{opacity:0;transform:translateY(6px)}}

.nav{position:fixed;left:0;right:0;top:auto;bottom:0;display:flex;align-items:center;gap:10px;padding:10px 14px calc(10px + env(safe-area-inset-bottom,0px));background:var(--panel);border-top:2px solid var(--line);margin:0;z-index:15}
.nav .mid{flex:1;min-width:0;text-align:center;display:grid;gap:3px}#secName{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-size:15px}body{padding-bottom:100px}

#ln{text-transform:none}.code{font-size:56px;letter-spacing:.15em;font-weight:600;color:var(--o2)}
.joinlink{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin-top:10px}.joinlink input{flex:1;min-width:220px;font:inherit;padding:9px 10px;border-radius:10px;border:2px solid var(--line);background:transparent;color:var(--ink);text-transform:none}.joinlink button{font:inherit;padding:9px 12px;border-radius:10px;border:2px solid var(--line);background:var(--ink);color:var(--bg);cursor:pointer}.pl{color:var(--mute);line-height:1.6}.pod div{font-size:22px;margin:8px 0}.tm{font-size:34px;color:var(--o2)}
#lv .qopt,#lv .qtop{text-align:left}
#lv input{-webkit-user-select:text;user-select:text}
.lab{margin:14px 0 4px;color:var(--mute);font-size:13px;letter-spacing:.12em;font-weight:600}
.top{text-align:right;font-size:13px}.conn{color:var(--mute)}.conn.on{color:#2fd37a}
.warn{color:var(--btn)}.good{color:#2fd37a;font-weight:600}
.count{display:flex;justify-content:center;align-items:baseline;gap:12px;margin:6px 0}.count span{color:var(--mute);letter-spacing:.12em;font-weight:600}.count b{font-size:44px;color:var(--o2)}
.plh{display:flex;justify-content:space-between;align-items:center;margin:14px 0 6px;text-align:left}.plh span{color:var(--mute);font-size:14px}
.plist{max-height:260px;overflow-y:auto;border:2px solid var(--line);border-radius:12px;text-align:left;-webkit-overflow-scrolling:touch}
.prow{display:flex;justify-content:space-between;gap:10px;padding:9px 12px;border-bottom:1px solid var(--line)}.prow:last-child{border-bottom:0}.pn{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.st{color:var(--mute);white-space:nowrap}.st.ok{color:#2fd37a;font-weight:600}
.qopt.sel{border-color:var(--o2);background:color-mix(in srgb,var(--o2) 18%,transparent)}.next:disabled{opacity:.4;cursor:default}
#lv .tab[aria-selected=true]{background:var(--ink);color:var(--bg)}
</style></head><body><main>
<header><h1>Breathe</h1><p>Hold INHALE and EXHALE to work the lungs, then try the games.</p></header>

<div class="wrap"><div><canvas id="c" width="600" height="620" tabindex="0" aria-label="Interactive lungs"></canvas><div id="cap" aria-live="polite"></div></div>
<aside><div class="row" id="direct"><button class="tab" data-i="14">Free breathing</button><button class="tab" data-i="13">Rhythm</button><button class="tab" data-i="7">Lung lab</button><button class="tab" data-i="15">Airflow</button><button class="tab" data-i="10">Gas exchange</button><button class="tab" data-i="16">🧠 Quiz</button><button class="tab q" id="lvb">🔴 LIVE QUIZ</button></div>

<div class="row seg"><button id="rest" aria-selected="true">Resting</button><button id="exer" aria-selected="false">Exercise</button></div>
<div><div class="meter"><span>Oxygen</span><div class="bar"><i id="o2b"></i></div><span id="o2t"></span></div><div class="meter"><span>CO₂</span><div class="bar"><i id="co2b"></i></div><span id="co2t"></span></div></div>
<div class="stats"><span>Score <b id="sc">0</b></span><span>Heart <b id="bpm">68</b> bpm</span></div>
<div id="stages" class="row" hidden><span>Nose</span><span>Throat</span><span>Trachea</span><span>Bronchi</span><span>Alveoli</span></div>
<div id="quiz" hidden><div class="qtop"><span id="qn">QUESTION 1/12</span><span id="qs">SCORE: 0</span></div><div class="bar"><i id="qbar" style="width:0;background:var(--o2)"></i></div><div id="qbody"></div></div>
<div class="pad"><button class="big" id="bi">INHALE</button><button class="big ex" id="be">EXHALE</button></div>
<div class="row"><button class="ghost" id="snd">Sound on</button><button class="ghost" id="back" hidden>Back to the lungs</button></div>
<div style="font-size:13px;color:var(--mute)">Keys: I or ↑ inhale, E or ↓ exhale.</div>
</aside></div></main>
<nav class="nav" aria-label="Section navigation"><button class="ghost" id="bk">← BACK</button><div class="mid"><b id="secNo">SECTION 1 / 18</b><span id="secName"></span><div class="bar"><i id="secBar" style="background:var(--o2)"></i></div></div><button class="next go" id="nx">NEXT →</button></nav>
<div id="live" hidden><div id="lv"></div></div>
<div id="done" hidden><div id="dn"></div></div>
<script>
const $=s=>document.querySelector(s),cv=$('#c'),g=cv.getContext('2d'),cl=(a,lo,hi)=>Math.max(lo,Math.min(hi,a));
const MSG={quiz:'Answer each question. The lungs keep breathing in the background, and right answers send oxygen through them.',breathe:'Hold INHALE or EXHALE. Release both to hold your breath. Switch to Exercise and compare.',rhythm:'Follow the ring: hold INHALE while it grows, let go to HOLD, then hold EXHALE as it shrinks.',lab:'Click a part: lungs, diaphragm, windpipe, bronchi, or the tiny alveoli.',airflow:'Hold INHALE and follow the oxygen from your nose to the alveoli. Each packet that arrives scores.'};
let mode='breathe',ex=false,v=0,inH=0,exH=0,auto=null,O2=55,CO2=20,score=0,fill=0,glow=0,zoom=false,hl='',hlT=0,beat=0,T0=0,rT=0,lastCyc=0,mT=0,tT=0,badT=0,demo=-1,spA=0,snd=true,ps=[],zp=[],stg=[0,0,0,0,0],clock=0,inA=0,exA=0,match=false;
const say=s=>$('#cap').textContent=s; say(MSG.breathe);
/* anatomy */
const N=[[300,20],[300,70],[300,120],[300,230]],mir=p=>[600-p[0],p[1]];
const LR=[[[250,280],[200,320],[178,336]],[[250,280],[235,355],[185,405],[165,425]],[[250,280],[235,355],[240,440],[232,472]]];
const routes=[...LR,...LR.map(r=>r.map(mir))];
const paths=routes.map(r=>{const pts=[...N,...r],l=[0];for(let i=1;i<pts.length;i++)l.push(l[i-1]+Math.hypot(pts[i][0]-pts[i-1][0],pts[i][1]-pts[i-1][1]));return{pts,l}});
const ends=paths.map(p=>p.pts[p.pts.length-1]);
const vmax=()=>ex?1:.5,Tf=(x,y)=>y<=230?[x,y]:[300+(x-300)*(1+.16*v),230+(y-230)*(1+.1*v)];
const dyD=()=>508+26*v,hD=()=>42*(1-.8*v);
function pos(P,u){const L=P.l,tot=L[L.length-1];let d=u*tot,i=1;while(i<L.length-1&&L[i]<d)i++;const a=P.pts[i-1],b=P.pts[i],f=(d-L[i-1])/(L[i]-L[i-1]);return[a[0]+(b[0]-a[0])*f,a[1]+(b[1]-a[1])*f,i-1]}
function spawn(c,n,st){for(let i=0;i<n&&ps.length<320;i++)ps.push({p:paths[Math.random()*6|0],u:c?1:-i*(st||0),d:c?-1:1,c,s:.85+Math.random()*.3,o:(Math.random()-.5)*12})}
/* rhythm */
const pat=()=>ex?[['in',2],['hold',1],['out',2]]:[['in',4],['hold',2],['out',4]];
function cur(){const pt=pat(),tot=pt.reduce((a,b)=>a+b[1],0);let t=rT%tot,i=0;while(t>=pt[i][1]){t-=pt[i][1];i++}return{n:pt[i][0],p:t/pt[i][1],d:pt[i][1],cyc:Math.floor(rT/tot)}}
/* sound */
let ac,ng,bp;function audio(){if(ac)return;try{ac=new(window.AudioContext||window.webkitAudioContext)();const b=ac.createBuffer(1,ac.sampleRate*2,ac.sampleRate),d=b.getChannelData(0);for(let i=0;i<d.length;i++)d[i]=Math.random()*2-1;const s=ac.createBufferSource();s.buffer=b;s.loop=true;bp=ac.createBiquadFilter();bp.type='bandpass';bp.Q.value=.7;ng=ac.createGain();ng.gain.value=0;s.connect(bp);bp.connect(ng);ng.connect(ac.destination);s.start()}catch(e){ac=null}}
function sound(){if(!ac)return;const on=snd&&(inA||exA);try{ng.gain.setTargetAtTime(on?(ex?.3:.18):0,ac.currentTime,.07);bp.frequency.setTargetAtTime(inA?500+v*900:exA?1300-v*700:800,ac.currentTime,.08)}catch(e){}}
/* simulation */
function step(dt){
 const vm=vmax();let dir=inH?1:exH?-1:0,c=null;
 if((mode==='quiz'||autoB)&&auto===null&&demo<0&&!inH&&!exH){qUp=!qUp;auto=qUp?vm*.85:0}
 if(demo>=0){demo+=dt;auto=demo<1.8?vm:0;if(demo>3.6)demo=-1}
 if(!dir&&auto!==null){dir=auto>v+.01?1:auto<v-.01?-1:0;if(!dir)auto=null}
 if(mode==='rhythm'){rT+=dt;c=cur();
  if(c.cyc!==lastCyc){lastCyc=c.cyc;const a=tT?mT/tT:0;if(a>=.7){const p=Math.round(a*50);score+=p;say('In rhythm! +'+p+' points. Keep going.')}else say('Close. Follow the ring and try the next round.');mT=tT=0}
  match=c.n==='in'?!!inH:c.n==='out'?!!exH:(!inH&&!exH);tT+=dt;if(match){mT+=dt;badT=0;score+=dt*6;glow=Math.min(1,glow+dt*3)}else{badT+=dt;glow=Math.max(0,glow-dt*2);if(badT>1.2){say(c.n==='in'?'Hint: press and hold INHALE while the ring grows.':c.n==='out'?'Hint: press and hold EXHALE while the ring shrinks.':'Hint: let go of both buttons and hold your breath.');badT=-2}}
  if(dir===0&&auto===null){}}
 else{match=false;glow=Math.max(0,glow-dt*(hl==='lung'?.2:1))}
 const rate=mode==='rhythm'&&c?vm/(c.d*.85):ex?.9:.35,nv=cl(v+dir*rate*dt,0,vm);
 inA=dir>0&&nv<vm-.002?1:0;exA=dir<0&&nv>.002?1:0;v=nv;if(v>vm)v=vm;
 const dem=ex?8:2.5;O2=cl(O2-dem*dt+(inA?(ex?30:16)*dt:0),0,100);CO2=cl(CO2+dem*.8*dt-(exA?22*dt:0),0,100);
 fill=inA?Math.min(1,fill+dt*2.5):exA?Math.max(.05,fill-dt*1.6):fill;
 const boost=match?1.35:1;
 if(inA){spA+=dt*(ex?60:28)*(match?1.6:1);while(spA>=1){spawn(0,1);spA--}}
 if(exA){spA+=dt*(ex?60:28);while(spA>=1){spawn(1,1);spA--}}
 const sp=(ex?330:170)*boost;
 for(const p of ps){p.u+=p.d*sp*p.s*dt/p.p.l[p.p.l.length-1];if(p.c===0){const s=pos(p.p,cl(p.u,0,1))[2],n=p.p.pts.length,i=s<=0?0:s===1?1:s===2?2:s<n-2?3:4;stg[i]=1}}
 ps=ps.filter(p=>{if(p.u>=1&&p.d>0){if(mode==='airflow')score++;if(mode==='airflow'||mode==='rhythm')glow=Math.max(glow,.5);return false}return p.u>0||p.d>0});
 for(let i=0;i<5;i++)stg[i]=Math.max(0,stg[i]-dt*1.4);
 if(hlT>0){hlT-=dt;if(hlT<=0){hl=secHl}}
 beat+=dt*(ex?130:68)/60;
 sound();
}
/* drawing */
function ribs(){g.strokeStyle='rgba(234,246,244,.22)';g.lineWidth=5;g.lineCap='round';for(let i=0;i<5;i++){const y=262+i*44-6*v,w=168+i*7+30*v;for(const s of[-1,1]){g.beginPath();g.moveTo(300+s*10,y-14);g.quadraticCurveTo(300+s*w*.7,y-26,300+s*w,y+20);g.stroke()}}}
function diaph(){const d=dyD(),h=hD();g.beginPath();g.moveTo(90,d);g.quadraticCurveTo(300,d-2*h,510,d);g.lineTo(510,d+24);g.quadraticCurveTo(300,d+24-2*h,90,d+24);g.closePath();g.fillStyle=hl==='diaphragm'?'#ff9a6b':'#b83d58';if(hl==='diaphragm'){g.shadowColor='#ffd27a';g.shadowBlur=26}g.fill();g.shadowBlur=0;
 if(inA||exA||hl==='diaphragm'){const dn=inA||demo>=0&&demo<1.8;g.fillStyle='rgba(255,230,160,.9)';const y=d+44+Math.sin(clock*8)*4,k=dn?1:-1;g.beginPath();g.moveTo(300-14,y-7*k);g.lineTo(300+14,y-7*k);g.lineTo(300,y+9*k);g.fill()}}
function lung(m){g.save();if(m){g.translate(600,0);g.scale(-1,1)}g.translate(300,230);g.scale(1+.16*v,1+.1*v);g.translate(-300,-230);
 g.beginPath();g.moveTo(292,238);g.bezierCurveTo(245,232,150,268,140,385);g.bezierCurveTo(136,455,170,492,232,496);g.bezierCurveTo(272,498,292,478,292,430);g.closePath();
 const gl=Math.max(glow,hl==='lung'?1:0);g.fillStyle=`hsl(352 70% ${60+gl*14}%)`;g.shadowColor='#fff0a0';g.shadowBlur=34*gl;g.fill();g.shadowBlur=0;g.lineWidth=3;g.strokeStyle='#ff9aa4';g.stroke();g.restore()}
function airways(){g.lineCap='round';const col=(w,a)=>{g.lineWidth=w;g.strokeStyle=a};
 col(30,'rgba(170,205,218,.45)');g.beginPath();g.moveTo(300,70);g.lineTo(300,230);g.stroke();
 col(20,`rgba(111,231,255,${.12+fill*.6})`);g.stroke();
 g.strokeStyle='rgba(255,255,255,.25)';g.lineWidth=3;for(let y=130;y<225;y+=14){g.beginPath();g.moveTo(288,y);g.lineTo(312,y);g.stroke()}
 if(hl==='trachea'){col(40,`rgba(255,243,160,${.35+.3*Math.sin(clock*9)})`);g.beginPath();g.moveTo(300,70);g.lineTo(300,230);g.stroke()}
 const W=[15,10,7,4,3];routes.forEach(r=>{const pts=[[300,230],...r];for(let i=1;i<pts.length;i++){const a=Tf(...pts[i-1]),b=Tf(...pts[i]),w=W[Math.min(i-1,4)];
  col(w+4,'rgba(170,205,218,.5)');g.beginPath();g.moveTo(...a);g.lineTo(...b);g.stroke();col(w,`rgba(111,231,255,${.1+fill*.65})`);g.stroke();
  if(hl==='bronchioles'&&i>=2){col(w+10,`rgba(255,243,160,${.35+.3*Math.sin(clock*7+i)})`);g.stroke()}if(hl==='bronchi'){const ph=(clock*1.4+i*.25)%1;col(w+8,`rgba(255,243,160,${.55*(1-ph)+.15})`);g.stroke()}}})}
function alveoli(){ends.forEach((e,k)=>{const[x,y]=Tf(...e),r=5+7*v,gl=hl==='alveoli'?1:0;
 g.setLineDash([5,5]);g.lineDashOffset=-beat*(ex?60:30);g.strokeStyle=`rgba(255,77,94,${.5+gl*.5})`;g.lineWidth=2;g.beginPath();g.arc(x,y,r*2.6,0,7);g.stroke();g.setLineDash([]);
 g.fillStyle=`rgba(255,200,208,.95)`;if(gl){g.shadowColor='#fff3a0';g.shadowBlur=18}

const esc=t=>String(t).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
/* ===== LIVE QUIZ — Netlify Functions + Blobs multiplayer ===== */
const SHARE_URL='';
const QP=(()=>{try{const p=new URLSearchParams(location.search),h=location.hash.replace(/^#\??/,'');if(h.includes('='))new URLSearchParams(h).forEach((v,k)=>{if(!p.has(k))p.set(k,v)});return p}catch(e){return new URLSearchParams()}})();
let studentMode=false;
const LV={role:'',code:'',hostToken:'',playerToken:'',name:'',total:10,T:20,list:[],i:-1,ph:'menu',left:0,ans:null,sel:null,score:0,pts:0,done:{},tick:null,busy:false,err:'',pre:'',top:[],people:[],n:10,q:null,rev:0};
const api=async(action,data={})=>{const r=await fetch('/.netlify/functions/quiz',{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify({action,...data})});const d=await r.json().catch(()=>({ok:false,error:'Server returned invalid data.'}));if(!r.ok||d.ok===false)throw new Error(d.error||'Server error');return d};
const token=()=>crypto.randomUUID()+crypto.randomUUID();
const chars='ABCDEFGHJKMNPQRSTUVWXYZ23456789';
const makeCode=()=>Array.from({length:5},()=>chars[Math.random()*chars.length|0]).join('');
const ord=n=>n+(n===1?'st':n===2?'nd':n===3?'rd':'th');
const players=()=>LV.people||[];
const pname=p=>String(p.name||'?');
const pscore=p=>+p.score||0;
const pod=t=>`<div class="pod">${t.map((x,i)=>`<div>${['🏆 1st','🥈 2nd','🥉 3rd'][i]} — ${esc(x.n)} — ${x.s.toLocaleString()}</div>`).join('')}</div>`;
const tmSet=()=>{const e=$('#tm');if(e)e.textContent=LV.left};
const rank=()=>players().map(p=>({n:pname(p),s:pscore(p)})).sort((a,b)=>b.s-a.s||a.n.localeCompare(b.n));
const answered=p=>LV.ph!=='setup'&&+p.qi===LV.i&&+p.a>=0;
const conn=()=>`<span class="conn on">● Live</span>`;
function studentLink(){try{const u=new URL('/',location.origin);u.searchParams.set('student','1');u.searchParams.set('room',LV.code);return u.href}catch{return''}}
function plist(pl){
 const mode=LV.ph;
 const sorted=pl.slice().sort((a,b)=>mode==='fin'?(pscore(b)-pscore(a)||pname(a).localeCompare(pname(b))):pname(a).localeCompare(pname(b),undefined,{sensitivity:'base'}));
 const rows=sorted.map(p=>{
  let st;
  if(mode==='fin') st=`<span class="st">${pscore(p).toLocaleString()} pts</span>`;
  else if(mode==='q'||mode==='rev'){const ok=answered(p);st=ok?'<span class="st ok">✓ Answered</span>':`<span class="st">○ ${mode==='rev'?'No answer':'Waiting'}</span>`;}
  else st='<span class="st">○ Waiting</span>';
  return `<div class="prow"><span class="pn">${esc(pname(p))}</span>${st}</div>`;
 }).join('');
 return `<div class="plh"><b>PLAYERS</b><span>${pl.length} joined</span></div><div class="plist" id="plist">${rows||'<div class="prow pl">Waiting for students to join…</div>'}</div>`;
}
function lvR(){const el=$('#lv');if(!el)return;const keep={lc:$('#lc')?$('#lc').value:null,ln:$('#ln')?$('#ln').value:null,f:document.activeElement&&document.activeElement.id},pls=players();let h='';
if(!LV.role){h=`<h2>LIVE QUIZ</h2><p class="pl">Live multiplayer is ready. Create a room or join one below.</p>${studentMode?'':`<div class="lvc"><h3>HOST A QUIZ</h3><p class="pl">Create a room, share the student link, then run the quiz from here.</p><button class="next" id="lh">CREATE ROOM</button></div>`}<div class="lvc"><h3>${studentMode?'JOIN THE QUIZ':'JOIN A QUIZ'}</h3><label for="lc">Room Code</label><input id="lc" type="text" maxlength="5" autocomplete="off" autocapitalize="characters" spellcheck="false" value="${esc(LV.pre)}"><label for="ln">Your Name</label><input id="ln" type="text" maxlength="16" autocomplete="off" autocapitalize="words" spellcheck="false"><p><button class="next alt" id="lj" ${LV.busy?'disabled':''}>${LV.busy?'JOINING…':'JOIN QUIZ'}</button></p><p id="le" class="pl warn">${esc(LV.err)}</p></div>`}
else if(LV.role==='host'){if(LV.ph==='setup'){const lk=studentLink();h=`<div class="top">${conn()}</div><h2>LIVE QUIZ · HOST</h2><p class="lab">ROOM CODE</p><div class="code">${LV.code}</div><p class="lab">STUDENT JOIN LINK</p><div class="joinlink"><input id="jlink" readonly value="${esc(lk)}"><button id="copyjoin">COPY STUDENT LINK</button></div><p class="pl">Students use this link. No Claude account or invitation is needed.</p><div class="lvc"><p class="lab">QUESTIONS</p><p>${[5,10,15,20].map(n=>`<button class="tab" data-n="${n}" aria-selected="${n===LV.total}">${n}</button>`).join(' ')}</p><p class="lab">SECONDS PER QUESTION</p><p>${[10,20,30,60].map(n=>`<button class="tab" data-t="${n}" aria-selected="${n===LV.T}">${n}</button>`).join(' ')}</p></div>${plist(pls)}<p><button class="next" id="ls" ${pls.length?'':'disabled'}>START QUIZ</button></p>`}
else if(LV.ph==='fin'){h=`<div class="top">${conn()}</div><h2>QUIZ COMPLETE</h2>${pod(rank().slice(0,3))}<p class="pl">Questions: ${LV.total} · Players: ${pls.length}</p>${plist(pls)}<p><button class="next" id="lnew">NEW QUIZ</button></p>`}
else{const rv=LV.ph==='rev',ct=[0,0,0,0],nA=pls.filter(answered).length;pls.forEach(p=>{if(p.qi===LV.i&&p.a>=0)ct[p.a]++});const q=LV.list[LV.i];h=`<div class="top">${conn()}</div><div class="qtop"><b>QUESTION ${LV.i+1} / ${LV.total}</b><b class="tm" id="tm">${rv?'':LV.left}</b></div><div class="count"><span>ANSWERED</span><b>${nA} / ${pls.length}</b></div><div class="bar"><i style="width:${pls.length?nA/pls.length*100:0}%;background:var(--o2)"></i></div><h3>${esc(q.t)}</h3><div class="qo">${q.o.map((t,k)=>`<div class="qopt ${rv&&k===q.c?'ok':''}">${'ABCD'[k]}. ${esc(t)}${rv?' ('+ct[k]+')':''}</div>`).join('')}</div>${rv?`<p class="pl">${esc(q.e)}</p>`:''}<p>${rv?`<button class="next" id="lnx">${LV.i<LV.total-1?'NEXT QUESTION':'SHOW RESULTS'}</button>`:'<button class="next" id="lrv">REVEAL ANSWER</button>'}<button class="ghost" id="lfin">Finish quiz</button></p>${plist(pls)}`}}
else{const nm=`<p class="res">${esc(LV.name)}</p>`,top=`<div class="top">${conn()}</div>`;if(LV.ph==='wait')h=`${top}<h2>You're in!</h2>${nm}<p class="pl">Room ${LV.code} · Waiting for the host…</p>`;else if(LV.ph==='q'&&LV.q)h=`${top}<div class="qtop"><b>QUESTION ${LV.i+1} / ${LV.n}</b><b class="tm" id="tm">${LV.left}</b></div><h3>${esc(LV.q.t)}</h3><div class="qo">${LV.q.o.map((t,k)=>`<button class="qopt ${(LV.ans?LV.ans.k:LV.sel)===k?'sel':''}" data-k="${k}" ${LV.ans?'disabled':''}>${'ABCD'[k]}. ${esc(t)}</button>`).join('')}</div><p><button class="next" id="lsub" ${LV.sel==null||LV.ans?'disabled':''}>${LV.ans?'ANSWER SUBMITTED ✓':'SUBMIT ANSWER'}</button></p><p class="pl">${LV.ans?'Waiting for the host to continue…':'Pick an answer, then press Submit.'}</p><p>Score: ${LV.score.toLocaleString()}</p>`;else if(LV.ph==='rev')h=`${top}<h2>${LV.pts?'CORRECT! +'+LV.pts:'Not quite. +0'}</h2><p>Answer: ${'ABCD'[LV.c]}. ${esc(LV.ca||'')}</p><p class="pl">${esc(LV.e||'')}</p><p class="res">Score: ${LV.score.toLocaleString()}</p><p class="pl">Waiting for the next question…</p>`;else if(LV.ph==='fin'){const me=players().find(p=>p.id===LV.playerToken),r=me?1+players().filter(p=>pscore(p)>pscore(me)).length:0;h=`${top}<h2>QUIZ COMPLETE</h2>${pod(LV.top||[])}<p>Your Score:</p><p class="res">${LV.score.toLocaleString()}</p><p>Your Position:</p><p class="res">${r?ord(r):'-'}</p>`}else h=`${top}<h2>Waiting for the host…</h2>${nm}`}
el.innerHTML=h+(LV.role?`<p><button class="ghost" id="lx">${studentMode?'Leave quiz':'Close live quiz'}</button></p>`:studentMode?'':'<p><button class="ghost" id="lx">Close live quiz</button></p>');if(keep.lc!==null&&$('#lc'))$('#lc').value=keep.lc;if(keep.ln!==null&&$('#ln'))$('#ln').value=keep.ln;if(keep.f&&(keep.f==='lc'||keep.f==='ln')&&$('#'+keep.f))$('#'+keep.f).focus()}
async function syncHost(){if(LV.role!=='host')return;try{const d=await api('get',{code:LV.code});LV.people=d.players||[];lvR()}catch(e){LV.err=e.message}}
async function syncStudent(){if(LV.role!=='stu')return;try{const d=await api('get',{code:LV.code});if(d.state)sIn(d.state);LV.people=d.players||[];lvR()}catch(e){if(/not found|expired/i.test(e.message)){LV.err=e.message;lvR()}}}
async function pushHost(){if(LV.role!=='host')return;const q=LV.list[LV.i],b={ph:LV.ph,i:LV.i,n:LV.total,T:LV.T};let state=b;if(LV.ph==='q'&&q)state={...b,q:{t:q.t,o:q.o},left:LV.left};else if(LV.ph==='rev'&&q)state={...b,c:q.c,e:q.e,ca:q.o[q.c]};else if(LV.ph==='fin')state={...b,top:rank().slice(0,3),pn:players().length};try{await api('host',{code:LV.code,hostToken:LV.hostToken,state})}catch(e){LV.err=e.message}}
async function lvHost(){if(LV.busy||LV.role)return;LV.busy=true;lvR();const code=makeCode(),hostToken=token();try{await api('create',{code,hostToken});Object.assign(LV,{role:'host',code,hostToken,ph:'setup',i:-1,list:[],busy:false,people:[]});LV.tick=setInterval(()=>{syncHost();},1000);lvR()}catch(e){LV.busy=false;LV.err=e.message;lvR()}}
function resetPlayerAnswers(){LV.people=LV.people.map(p=>({...p,qi:LV.i,a:-1}))}
function hTick(){if(LV.ph==='q'){LV.left--;if(LV.left<=0){hRev();return}tmSet()}pushHost()}
function hStart(){if(!players().length)return;LV.total=Math.min(LV.total,POOL.length);LV.list=shuf(POOL).slice(0,LV.total).map(a=>{const x=shuf(a[1].map((t,k)=>[t,k===a[2]]));return{t:a[0],o:x.map(y=>y[0]),c:x.findIndex(y=>y[1]),e:a[3]}});LV.i=-1;hNext()}
function hNext(){LV.i++;if(LV.i>=LV.total)return hFin();LV.ph='q';LV.left=LV.T;resetPlayerAnswers();pushHost();lvR()}
function hRev(){if(LV.ph!=='q')return;LV.ph='rev';pushHost();lvR()}
function hFin(){LV.ph='fin';pushHost();lvR()}
function hNew(){LV.ph='setup';LV.i=-1;LV.list=[];LV.people=[];pushHost();lvR()}
async function lvJoin(){if(LV.busy)return;const code=($('#lc').value||'').trim().toUpperCase().replace(/[^A-Z0-9]/g,'').slice(0,5),name=($('#ln').value||'').replace(/[\u0000-\u001f\u007f]/g,'').trim().slice(0,16);if(code.length<5||!name){LV.err='Enter the 5-character room code and your name.';lvR();return}LV.busy=true;LV.err='';LV.pre=code;lvR();try{const playerToken=token(),d=await api('join',{code,name,playerToken});Object.assign(LV,{role:'stu',code,name,playerToken,ph:'wait',score:0,ans:null,sel:null,busy:false,err:'',top:[],people:[d.player]});if(d.state)sIn(d.state);LV.tick=setInterval(()=>{syncStudent();api('presence',{code:LV.code,playerToken:LV.playerToken,data:{score:LV.score,qi:LV.i,a:LV.ans?LV.ans.k:-1}}).catch(()=>{});},1000);lvR()}catch(e){LV.busy=false;LV.err=e.message||'Could not join the room.';lvR()}}
function sIn(d){if(!d||LV.role!=='stu')return;if(d.ph==='setup'){Object.assign(LV,{ph:'wait',score:0,ans:null,sel:null,done:{},i:-1,top:[]});lvR();return}if(d.ph==='q'){if(LV.ph==='q'&&LV.i===d.i){LV.left=d.left;tmSet();return}Object.assign(LV,{ph:'q',i:d.i,n:d.n,T:d.T,q:d.q,left:d.left,ans:null,sel:null,pts:0})}else if(d.ph==='rev'){LV.i=d.i;if(!LV.done[d.i]){LV.done[d.i]=1;const ok=LV.ans&&LV.ans.i===d.i&&LV.ans.k===d.c;LV.pts=ok?1000+Math.round(500*LV.ans.f):0;LV.score+=LV.pts;api('presence',{code:LV.code,playerToken:LV.playerToken,data:{score:LV.score,qi:LV.i,a:LV.ans?LV.ans.k:-1}}).catch(()=>{})}Object.assign(LV,{ph:'rev',c:d.c,e:d.e,ca:d.ca})}else if(d.ph==='fin')Object.assign(LV,{ph:'fin',top:d.top||[],pn:d.pn,n:d.n});lvR()}
function sAns(){if(LV.ans||LV.sel==null||LV.ph!=='q'||LV.left<=0)return;LV.ans={i:LV.i,k:LV.sel,f:LV.left/LV.T};api('answer',{code:LV.code,playerToken:LV.playerToken,i:LV.i,k:LV.sel}).catch(()=>{});lvR()}
async function lvLeave(){clearInterval(LV.tick);if(LV.role==='stu'&&LV.code&&LV.playerToken)api('leave',{code:LV.code,playerToken:LV.playerToken}).catch(()=>{});Object.assign(LV,{role:'',code:'',hostToken:'',playerToken:'',name:'',ph:'menu',list:[],i:-1,ans:null,sel:null,busy:false,err:'',top:[],people:[]})}
function lvClose(){lvLeave();if(studentMode)lvR();else $('#live').hidden=true}
function enterStudent(){if(studentMode)return;studentMode=true;document.querySelectorAll('body > *').forEach(x=>{if(x.id!=='live')x.style.display='none'});document.body.style.paddingBottom='0';$('#live').hidden=false;lvR()}
function copyLink(b){const x=$('#jlink'),ok=()=>{b.textContent='COPIED ✓';setTimeout(()=>b.textContent='COPY STUDENT LINK',1500)},fb=()=>{try{x.focus();x.select();document.execCommand('copy')?ok():b.textContent='PRESS CTRL/CMD+C'}catch(e){b.textContent='PRESS CTRL/CMD+C'}};try{navigator.clipboard.writeText(x.value).then(ok).catch(fb)}catch(e){fb()}}
$('#live').addEventListener('click',e=>{const b=e.target.closest('button');if(!b||b.disabled)return;try{audio()}catch(_){}const id=b.id;if(id==='lx')lvClose();else if(id==='copyjoin')copyLink(b);else if(id==='lh')lvHost();else if(id==='lj')lvJoin();else if(id==='ls')hStart();else if(id==='lrv')hRev();else if(id==='lnx')hNext();else if(id==='lfin')hFin();else if(id==='lnew')hNew();else if(id==='lsub')sAns();else if(b.dataset.n){LV.total=+b.dataset.n;lvR()}else if(b.dataset.t){LV.T=+b.dataset.t;lvR()}else if(b.dataset.k!==undefined&&LV.role==='stu'&&!LV.ans){LV.sel=+b.dataset.k;lvR()}});
$('#live').addEventListener('keydown',e=>{if((e.target.id==='lc'||e.target.id==='ln')&&e.key==='Enter')lvJoin()});$('#lvb').onclick=()=>{$('#live').hidden=false;lvR()};
if(QP.get('student')==='1'){LV.pre=(QP.get('room')||'').toUpperCase().slice(0,5);enterStudent()}
document.querySelectorAll('#direct .tab[data-i]').forEach(b=>b.onclick=()=>{audio();goSec(+b.dataset.i)});
function ui(){$('#o2b').style.width=O2+'%';$('#co2b').style.width=CO2+'%';$('#o2t').textContent=Math.round(O2);$('#co2t').textContent=Math.round(CO2);$('#sc').textContent=Math.round(score);$('#bpm').textContent=ex?130:68;
 if(mode==='airflow')document.querySelectorAll('#stages span').forEach((s,i)=>s.style.setProperty('--l',stg[i]))}
function loop(t){const dt=Math.min(.05,(t-T0)/1000||0);T0=t;clock+=dt;step(dt);draw(dt);ui();requestAnimationFrame(loop)}
if(QP.get('student')==='1'){LV.pre=(QP.get('room')||'').toUpperCase().slice(0,5);enterStudent()}
goSec(0);requestAnimationFrame(loop);
</script></body></html>
